# MusicSense: comprobaciones en cada cambio (las automatizaciones de Pear
# Desktop están desactivadas en GitHub: publicaban con su nombre y usaban
# claves que solo tiene Pear)
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Tipos y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
        env:
          # Electron no hace falta para comprobar el código
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tipos (TypeScript)
        run: pnpm typecheck

      - name: Lint (oxlint)
        run: pnpm lint
